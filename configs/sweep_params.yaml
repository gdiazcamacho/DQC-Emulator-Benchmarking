emulators:
  - qiskit_aer
  - squidasm
  - interlin-q
  - squanch

num_qubits_range:
  - 4
  - 6
  - 8
  - 10
  - 12
  - 14
  - 16
  - 18
  - 20

num_nodes_range:
  - 1
  - 2
  - 4
  - 8

theta_range:
  - 0.0
  - 0.33
  - 0.66

shots: 100

# Minimum number of qubits a node must hold for a (qubits, nodes) point to be
# included in the sweep. A node with a single qubit performs no local
# controlled rotations, so such a point measures communication overhead against
# an empty local circuit rather than a partitioned iQFT.
#   2 -> exclude degenerate partitions (default; recommended)
#   1 -> original grid, including [1, 1, ...] partitions
# Partitions that are outright impossible (num_qubits < num_nodes) are always
# excluded regardless of this setting.
min_qubits_per_node: 2
