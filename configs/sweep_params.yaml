# Emulators to benchmark. Directory names under emulators/
emulators:
  - qiskit_aer
  - squidasm
  - interlin-q
  - squanch
  - cunqa

# Algorithm selects WHICH script runs: scripts/<algorithm>_multinode.py
algorithms:
  - qft

# Communication mode selects a branch INSIDE that script.
#   basic   - one teleportation per cross-node controlled-phase gate
#   packed  - cat-entangle/disentangle packing (one teleportation per control)
#   dynamic - deferred-measurement / semiclassical iQFT (zero e-bits)
#   native  - emulator partitions and teleports on its own (not user-controlled)
comm_modes:
  - basic
  - packed
  - dynamic
  - native

num_qubits_range:
  - 4
  - 6
  - 8
  - 10
  - 12
  - 14
  - 16
  - 18
  - 20

num_nodes_range:
  - 1
  - 2
  - 4
  - 8

theta_range:
  - 0.0
  - 0.33
  - 0.66

shots: 100