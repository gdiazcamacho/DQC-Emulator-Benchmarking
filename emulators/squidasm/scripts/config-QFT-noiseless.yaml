# Perfect 2 node network, no noise from either computation on the nodes or communication between nodes
qdevice_cfg: &qdevice_cfg
  # num_qubits: 2
  T1: 0
  T2: 0

  # gate execution times
  init_time: 10
  single_qubit_gate_time: 10
  two_qubit_gate_time: 10
  measure_time: 10

  # noise model
  single_qubit_gate_depolar_prob: 0.
  two_qubit_gate_depolar_prob: 0.

stacks:
  - name: Alice
    qdevice_typ: generic
    qdevice_cfg:
      <<: *qdevice_cfg
  - name: Bob
    qdevice_typ: generic
    qdevice_cfg:
      <<: *qdevice_cfg

links:
  - stack1: Alice
    stack2: Bob
    typ: perfect
    cfg:
      dummy: null

clinks:
  - stack1: Alice
    stack2: Bob
    typ: instant