# NOISY "device" network, used for --noise device: 1% / 10% single/two-qubit
# gate depolarising, depolarising links with fidelity 0.9, finite T1/T2.
# (Previously headed "Perfect ... no noise", which it never was.)
# The noiseless network for --noise none is config-QFT-noiseless.yaml.
qdevice_cfg: &qdevice_cfg
  # num_qubits: 2
  T1: 10_000_000_000
  T2: 1_000_000_000

  # gate execution times
  init_time: 10_000
  single_qubit_gate_time: 1_000
  two_qubit_gate_time: 100_000
  measure_time: 10_000

  # noise model
  single_qubit_gate_depolar_prob: 0.01
  two_qubit_gate_depolar_prob: 0.1


link_cfg: &link_cfg
  # Fidelity between the EPR pair qubits
  fidelity: 0.9
  # Time in nanoseconds for an attempt to generated entanglement
  t_cycle: 10.
  # Chance for each attempt at entanglement to succeed
  prob_success: 0.8

stacks:
  - name: AbstractNode
    qdevice_typ: generic
    qdevice_cfg:
      <<: *qdevice_cfg

links:
  - stack1: AbstractNode0
    stack2: AbstractNode1
    typ: depolarise
    cfg:
      <<: *link_cfg

clinks:
  - stack1: AbstractNode0
    stack2: AbstractNode1
    typ: instant